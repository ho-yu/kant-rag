[project]
name = "rag-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "이정원", email = "piglove06@hanmail.net" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "kiwipiepy>=0.24.1",
    "langchain>=1.4.9",
    "langchain-community>=0.3.31,<0.4",
    "langchain-core>=1.7.6",
    "langchain-huggingface>=1.2.3",
    "langchain-openai>=1.7.4",
    "langchain-qdrant>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "langfuse>=5.1.0",
    "numpy>=2.5.4",
    "openai>=3.3.0",
    "pandas>=3.1.1",
    "pdfplumber>=0.11.10",
    "pydantic>=2.14.2",
    "pymupdf>=2.1",
    "pymupdf4llm>=2.1",
    "pypdf>=6.21.4",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.20.0",
    "ragas>=0.4.3",
    "rank-bm25>=0.2.2",
    "requests>=2.34.2",
    "sentence-transformers>=6.2.0",
    "streamlit>=1.66.1",
    "tenacity>=9.2.1",
    "tiktoken>=0.14.0",
    "tqdm>=4.70.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
rag-service = "rag_service:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
